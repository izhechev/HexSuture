name: HexSuture tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows-replay:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Build HexSuture
        run: dotnet build src/HexSuture --configuration Release --warnaserror
      - name: Test replay and privacy
        run: python tests/test_replay.py src/HexSuture/bin/Release/net10.0/HexSuture.dll
      - name: Test scan and detection evidence
        run: python tests/test_scan_evidence.py src/HexSuture/bin/Release/net10.0/HexSuture.dll
      - name: Test existing case databases
        run: python tests/test_migration.py src/HexSuture/bin/Release/net10.0/HexSuture.dll
      - name: Test task cleanup and interrupted retries
        run: dotnet run --project tests/TaskWorkflow --configuration Release
      - name: Check live Task Scheduler disable and rollback
        shell: pwsh
        run: ./tests/live_task.ps1 src/HexSuture/bin/Release/net10.0/HexSuture.dll

  live-defender:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Build HexSuture
        run: dotnet build src/HexSuture --configuration Release --warnaserror
      - name: Prepare an isolated Defender test volume
        shell: pwsh
        run: |
          $image = Join-Path $env:RUNNER_TEMP ("hexsuture-" + [guid]::NewGuid() + ".vhd")
          $script = Join-Path $env:RUNNER_TEMP ("create-" + [guid]::NewGuid() + ".txt")
          "create vdisk file=`"$image`" maximum=128 type=expandable" | Set-Content -LiteralPath $script -Encoding ascii
          diskpart /s $script
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $image)) { throw "Test image creation failed." }
          $disk = Mount-DiskImage -ImagePath $image -PassThru | Get-Disk
          if (@($disk).Count -ne 1 -or $disk.IsBoot -or $disk.IsSystem -or $disk.PartitionStyle -ne 'RAW' -or ($disk.Size -lt 120MB -or $disk.Size -gt 129MB)) {
            throw "The mounted test image is not a new, empty 128 MB disk."
          }
          $letter = 'X','Y','Z' | Where-Object { !(Get-PSDrive -Name $_ -ErrorAction SilentlyContinue) } | Select-Object -First 1
          if (!$letter) { throw "No unused test drive letter." }
          $partition = $disk | Initialize-Disk -PartitionStyle MBR -PassThru | New-Partition -UseMaximumSize -DriveLetter $letter
          $volume = $partition | Format-Volume -FileSystem NTFS -NewFileSystemLabel HexSutureTest -Confirm:$false
          if ($volume.DriveLetter -ne $letter) { throw "The expected test volume was not mounted." }
          Write-Host "Test fixture volume: $letter"
          "$($volume.DriveLetter):\" | Set-Content -LiteralPath "$env:RUNNER_TEMP/hexsuture-drive.txt"
      - name: Scan 100 benign files and check EICAR attribution
        shell: pwsh
        run: |
          $root = (Get-Content -LiteralPath "$env:RUNNER_TEMP/hexsuture-drive.txt" -Raw).Trim()
          python tests/live_scan.py src/HexSuture/bin/Release/net10.0/HexSuture.dll --eicar --parent $root
      - name: Diagnose Defender coverage on the disposable runner
        if: failure()
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled | Format-List
          $filter = @{ LogName = 'Microsoft-Windows-Windows Defender/Operational'; Id = 1006,1007,1116,1117,1118,1119; StartTime = (Get-Date).AddMinutes(-10) }
          Get-WinEvent -FilterHashtable $filter -ErrorAction SilentlyContinue | ForEach-Object {
            $fields = ([xml]$_.ToXml()).Event.EventData.Data
            $resource = ($fields | Where-Object Name -eq 'Path').'#text'
            $threat = ($fields | Where-Object Name -eq 'Threat Name').'#text'
            [pscustomobject]@{ Event = $_.Id; Eicar = $threat -match 'EICAR'; TestFolder = $resource -match 'hexsuture-scan-'; FileResource = $resource -match 'file:' }
          } | Format-Table
